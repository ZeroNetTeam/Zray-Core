[workspace]
resolver = "2"
members = [
    "crates/zero-core",
    "crates/zero-config",
    "crates/zero-net",
    "crates/zero-dns",
    "crates/zero-router",
    "crates/zero-security",
    "crates/reality",
    "crates/zero-transport",
    "crates/zero-protocol",
    "crates/zero-runtime",
    "crates/zero-evasion",
    "crates/zero-observatory",
    "crates/zero-tun",
    "crates/zray-cli",
    "crates/zero-scanner",
    "crates/zero-discovery",
    "crates/zero-tor",
    "crates/zero-masterdns",
    "crates/zero-provision",
    # Allocation counts for the framed read paths. A workspace member so it
    # resolves the same dependency versions as the code it measures, and so its
    # release profile is the shipped one.
    "bench/hotpath",
    # What a proxied page load looks like from outside the tunnel: packet
    # sizes and directions, scored the way a traffic classifier would.
    "bench/shape",
    # What one REALITY handshake costs the server: the official Xray binary
    # against this workspace's server, with the same client on both.
    "bench/reality-handshake",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
repository = "https://github.com/ZeroNetTeam/Zray-Core"

[workspace.dependencies]
zero-core = { path = "crates/zero-core", version = "0.1.0" }
zero-config = { path = "crates/zero-config", version = "0.1.0" }
zero-net = { path = "crates/zero-net", version = "0.1.0" }
zero-dns = { path = "crates/zero-dns", version = "0.1.0" }
zero-router = { path = "crates/zero-router", version = "0.1.0" }
zero-security = { path = "crates/zero-security", version = "0.1.0" }
reality = { path = "crates/reality", version = "0.1.0" }
zero-transport = { path = "crates/zero-transport", version = "0.1.0" }
zero-protocol = { path = "crates/zero-protocol", version = "0.1.0" }
zero-runtime = { path = "crates/zero-runtime", version = "0.1.0" }
zero-evasion = { path = "crates/zero-evasion", version = "0.1.0" }
zero-observatory = { path = "crates/zero-observatory", version = "0.1.0" }
zero-tun = { path = "crates/zero-tun", version = "0.1.0" }
zero-scanner = { path = "crates/zero-scanner", version = "0.1.0" }
zero-discovery = { path = "crates/zero-discovery", version = "0.1.0" }
zray-cli = { path = "crates/zray-cli", version = "0.1.0" }
zero-tor = { path = "crates/zero-tor", version = "0.1.0" }
zero-masterdns = { path = "crates/zero-masterdns", version = "0.1.0" }
zero-provision = { path = "crates/zero-provision", version = "0.1.0" }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "aws-lc-rs", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12", "logging", "zlib"] }
rustls-pki-types = "1"
ring = "0.17"
webpki-roots = "1"
bytes = "1"
blake3 = "1"
futures = "0.3"
netstack-smoltcp = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
aho-corasick = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf-cache", "perf-inline", "perf-literal", "perf-onepass", "perf-backtrack"] }
ipnet = "2"
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
url = "2"
percent-encoding = "2"
httparse = "1"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
quinn-proto = { version = "0.11", default-features = false }
flate2 = "1"
http = "1"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
cipher = "0.4"
ctr = "0.9"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.3.2", features = ["getrandom"] }
ml-dsa = "0.1.1"
boringtun = { version = "0.7.1", default-features = false }
# Salamander (Hysteria 2 obfuscation) hashes with BLAKE2b; the version the WireGuard
# stack already builds.
blake2 = { version = "0.10", default-features = false }
subtle = "2"
anyhow = "1"
libc = "0.2"
zstd = "0.13"
# LZ4 block codec for the MasterDNS tunnel's optional payload compression.
# Pure Rust (no C), and the two `safe-*` features keep the decoder out of
# `unsafe`, which matters for a codec that runs on bytes a remote end chose.
# `default-features = false` drops the LZ4 *frame* module and its xxhash
# dependency; only the raw block API (size-prefixed) is used, to match the
# Go server's `lz4.CompressBlock` + 4-byte little-endian length header.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
# Decode-only brotli, for certificate compression. rustls' own `brotli`
# feature links the full compressor as well (~800 KB of the mobile core) for
# a job only a server does.
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
zeroize = "1"

# Optimised for size: on the SOCKS/TLS path the time goes into the crypto
# (hand-written assembly in ring/aws-lc) and the kernel, and the benchmark in
# docs/benchmarks measures the same speed as -O3 within noise, at about a third
# less file size. The user-space packet stack keeps -O3 below, since TUN mode
# spends its time there.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = "s"

[profile.release.package.smoltcp]
opt-level = 3
[profile.release.package.netstack-smoltcp]
opt-level = 3
[profile.release.package.zero-tun]
opt-level = 3

[patch.crates-io]
# The ordinary crates.io rustls API cannot control ClientHello extension order,
# GREASE, or padding. This is the shaping fork pinned to the same audited
# revision used by the bundled Xray reference (the fork itself is MPL-2.0),
# vendored so the ClientHello can carry another legacy version. See
# vendor/rustls/PATCHES.md.
rustls = { path = "vendor/rustls" }
# TUN userspace stack with local fixes for per-connection memory: duplicate
# sockets from retransmitted SYNs and orphaned connections held for two
# hours. See vendor/netstack-smoltcp/PATCHES.md.
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }
