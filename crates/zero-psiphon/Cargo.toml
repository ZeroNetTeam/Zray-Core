[package]
name = "zero-psiphon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zero-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
ed25519-dalek = { workspace = true }
russh = { workspace = true }
# NaCl's box, for the meek cookie and the tactics payloads. Assembled here from
# the primitives rather than pulled in whole: see src/nacl_box.rs.
salsa20 = { version = "0.11", default-features = false }
poly1305 = { version = "0.9", default-features = false }
universal-hash = "0.5"
x25519-dalek = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
futures = { workspace = true }
url = { workspace = true }

[features]
# The mock Psiphon server the end-to-end tests drive a client against, and the
# helpers that build signed server entries. Off everywhere but tests so the
# shipped binary carries none of it.
test-util = []
