[package]
name = "zero-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Mirrors zero-runtime's `tor`: set wherever the embedded Tor client is built
# in, so the one-click catalog can mark the Tor entry usable rather than
# planned. Dependency-free on purpose — it only flips a flag.
tor = []

[dependencies]
zero-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
regex = { workspace = true }
