[package]
name = "zray-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "zray"
path = "src/main.rs"

[features]
# Build in the Tor client (Arti). Off by default; see zero-runtime's `tor`.
tor = ["zero-runtime/tor", "zero-config/tor"]

[dependencies]
zero-core = { workspace = true }
zero-config = { workspace = true }
zero-net = { workspace = true }
zero-router = { workspace = true }
zero-runtime = { workspace = true, features = ["panel"] }
zero-protocol = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
zero-security = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
x25519-dalek = { workspace = true }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = "0.18"
