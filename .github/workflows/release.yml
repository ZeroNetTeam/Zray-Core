name: release

# Push a tag like `v0.2.0` and Zray Core, the command line engine, lands on the
# GitHub Releases page for Windows and Linux (x64 and ARM64), with a signed
# SHA256SUMS.txt. The apps install the server program on people's own servers
# from this page, so the signature is part of the release. Running it by hand
# builds the same files as workflow artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  # The version `zray --version` reports. Empty for a build-only run, which
  # then reports the crate version.
  ZERONET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p zray-cli
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, core | Out-Null
          Copy-Item target/release/zray.exe core/
          Copy-Item LICENSE core/
          Compress-Archive -Path core/* -DestinationPath dist/ZrayCore-Windows-x64.zip
          Copy-Item target/release/zray.exe dist/ZrayCore-Windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # `label` names the downloads. "x64" and "ARM64" rather than the
        # kernel's x86_64/aarch64: people picked the ARM file on ordinary
        # PCs and got "exec format error". The server installer
        # (zero-provision's layout.rs) looks for these exact names.
        include:
          - label: x64
            runner: ubuntu-22.04
          - label: ARM64
            runner: ubuntu-22.04-arm
    # The oldest supported runner: glibc is forward compatible only, so
    # building here keeps the binary running on older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p zray-cli
      - name: tarball and bare program
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p dist
          # A tarball keeps the executable bit that a browser download drops.
          core="ZrayCore-Linux-${LABEL}"
          mkdir -p "$core"
          cp target/release/zray LICENSE "$core/"
          tar -czf "dist/$core.tar.gz" "$core"
          install -m755 target/release/zray "dist/$core"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.label }}
          path: dist/*

  publish:
    name: publish release
    # A pushed tag, or a manual run given a version: the release action then
    # creates the tag on this commit.
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # The apps install the server program on people's own servers only after
      # this list's signature checks out against the key built into them, so a
      # release without a signature simply cannot be installed from the app.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: sign the checksums
        env:
          CROWD_SIGNING_KEY: ${{ secrets.CROWD_SIGNING_KEY }}
        run: |
          if [ -z "$CROWD_SIGNING_KEY" ]; then
            echo "::warning::No CROWD_SIGNING_KEY; SHA256SUMS.txt is unsigned, so the apps cannot install the server from this release."
            exit 0
          fi
          cargo build --release --manifest-path src/Cargo.toml -p zero-discovery --bin zeronet-sign
          sign=src/target/release/zeronet-sign
          $sign sign dist/SHA256SUMS.txt
          # A seed that belongs to another key would publish a signature no app accepts.
          $sign verify dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Zray Core ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Zray Core

            The engine on its own: a command-line program for servers, routers and scripts (`zray run config.json`).

            | | Download this |
            |---|---|
            | Windows | `ZrayCore-Windows-x64.zip` |
            | Linux, Intel / AMD | `ZrayCore-Linux-x64.tar.gz` |
            | Linux on ARM | `ZrayCore-Linux-ARM64.tar.gz` |

            **Not sure which Linux file?** Run `uname -m`: `x86_64` → **x64**, `aarch64` → **ARM64**. "exec format error" means the other one.
            `SHA256SUMS.txt` and its signature are for the apps that install the server program from this page.

            **زری کور** همون موتور بدون اپه ، یه برنامه ی خط فرمان برای سرور و روتر و اسکریپت (`zray run config.json`) . اگه نمیدونی کدوم فایل لینوکس رو بگیری توی ترمینال `uname -m` رو بزن : `x86_64` یعنی **x64** و `aarch64` یعنی **ARM64** .

            اپ ها : [ZeroNet-Desktop](https://github.com/ZeroNetTeam/ZeroNet-Desktop/releases/latest) و [ZeroNet-Mobile](https://github.com/ZeroNetTeam/ZeroNet-Mobile/releases/latest)
