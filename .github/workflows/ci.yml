name: ci

on:
  push:
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: formatting
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace --all-targets

      # Doc examples are not covered by --all-targets and are the easiest place
      # for a stale API to survive unnoticed.
      - name: doc tests
        run: cargo test --workspace --doc

      - name: release build
        run: cargo build --workspace --release

  minimum-toolchain:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Declaring an MSRV that the workspace does not actually build under is
      # worse than declaring none, because downstream trusts the number.
      - run: cargo check --workspace --all-targets

  policy:
    name: dependency and provenance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

      # A lockfile that changes during a build means the audited dependency set
      # is not the one being shipped.
      - name: lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null

  # `fuzz` is a workspace of its own, so `cargo check --workspace` never looks
  # at it. Builds the targets; running them is a maintainer's job, per
  # fuzz/README.md.
  fuzz-targets:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Not `--locked`. A lockfile is resolved per platform, so one written on
      # a single machine is missing the crates every other platform needs, and
      # pinning it fails the build everywhere except where it was written. The
      # git dependency is pinned by branch, so re-resolving stays deterministic
      # about the part that actually matters.
      - name: check the fuzz targets build
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  cross:
    name: cross-platform check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The TUN and raw-socket paths drift per platform, so every desktop
      # target is compiled even where the tests cannot run.
      - run: cargo check --workspace --target ${{ matrix.target }}

  # macOS is a desktop target for the same crate set, and its utun and
  # ifconfig/route paths are the ones the cross job only type-checks.
  macos:
    name: macOS unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p zero-tun -p zero-core

  # The hot-path benchmark asserts bit-identity for the framed read paths and
  # reports their allocation counts exactly, via a counting global allocator.
  # An allocation count is the same on every machine, so a regression in it is
  # visible in review; the wall-clock times it also prints are context only and
  # are deliberately not gated on.
  hotpath:
    name: hot path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: allocation counts and bit-identity
        run: cargo run --release -p hotpath-bench

  # The shape benchmark replays one proxied page load through each client
  # framing and prints the packet sizes and directions an observer would see.
  # It runs on scripted traffic with paused time, so its numbers are the same
  # everywhere; it fails when a connection opens with a small packet again or
  # a framing starts costing more upload than it did.
  shape:
    name: traffic shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: packet sizes of a proxied page load
        run: cargo run --release -p shape-bench
