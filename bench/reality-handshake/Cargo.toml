[package]
name = "reality-handshake-bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The server under test: the handshake the runtime wires into a listener, and
# the config parser that turns a `realitySettings` block into its parameters.
reality = { path = "../../crates/reality" }
# The client under test, and the one client both servers are measured with.
zero-security = { path = "../../crates/zero-security" }
# The VLESS request the pre-flight round trip carries, so the endpoint under
# measurement is proved to be a proxy and not merely a handshake acceptor.
zero-protocol = { path = "../../crates/zero-protocol" }
zero-core = { path = "../../crates/zero-core" }
serde_json = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
